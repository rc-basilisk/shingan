[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.31.0"
ci = "github"
installers = ["shell", "powershell"]
targets = [
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
hosting = "github"
merge-tasks = false
allow-dirty = ["ci"]

# Only the GUI's windowing/graphics headers are needed to build on Linux.
# (Video hashing calls the `ffmpeg` command-line tool at runtime; nothing links
# against FFmpeg, so no FFmpeg libraries are bundled.)
[dist.dependencies.apt]
pkg-config = "*"
libxkbcommon-dev = "*"
libxcb1-dev = "*"
libxcb-render0-dev = "*"
libxcb-shape0-dev = "*"
libxcb-xfixes0-dev = "*"
libdbus-1-dev = "*"
libgl-dev = "*"
libegl-dev = "*"
libwayland-dev = "*"
