[package]
name = "shingan-ml"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["onnx"]
onnx = ["dep:ort", "dep:ndarray", "dep:libloading"]
# Cloud vision providers (Ollama, OpenAI, Gemini, Anthropic) over HTTP.
cloud = ["dep:reqwest", "dep:tar", "dep:flate2", "dep:zip"]
# Deprecated aliases kept for compatibility with 0.1.x build scripts.
cloud-ollama = ["cloud"]
cloud-openai = ["cloud"]
cloud-gemini = ["cloud"]

[dependencies]
shingan-core.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
image.workspace = true
img_hash = { workspace = true }
image_for_hash = { package = "image", version = "0.23", default-features = true }
dirs.workspace = true

ort = { workspace = true, optional = true }
ndarray = { workspace = true, optional = true }
libloading = { workspace = true, optional = true }

reqwest = { workspace = true, optional = true, features = ["json", "blocking"] }
tar = { version = "0.4", optional = true }
flate2 = { version = "1", optional = true }
zip = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"
